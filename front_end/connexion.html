<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Client | Créa Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --dark: #080808;
  --dark-2: #111111;
  --dark-3: #1a1a1a;
  --cream: #f2ede4;
  --orange: #e85d26;
  --orange-light: #ff7a47;
  --muted: rgba(242, 237, 228, 0.55);
  --border: rgba(242, 237, 228, 0.08);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--cream); cursor: none; }
a { text-decoration: none; color: inherit; }

/* CURSOR */
.cursor { position: fixed; width: 12px; height: 12px; background: var(--orange); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
.cursor-ring { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(232,93,38,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); }
.cursor.hover { width: 6px; height: 6px; }
.cursor-ring.hover { width: 60px; height: 60px; border-color: var(--orange); }

nav { position: centre; top: 50; left: 50; right: 50; z-index: 100; padding: 24px 48px; display: flex; align-items: center; justify-content: space-between; background: rgba(8,8,8,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
.logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; cursor: pointer; }
.logo span { color: var(--orange); }

    * État par défaut : logo flottant au centre */
.logo {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 100;
  padding: 24px 48px;
  background: rgba(8,8,8,0.95);
  backdrop-filter: blur(20px);
  border-radius: 12px;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
    
    
.auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 120px 24px 80px; }
.auth-box { width: 100%; max-width: 420px; background: var(--dark-2); padding: 48px; border: 1px solid var(--border); border-radius: 12px; text-align: center; }
.auth-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.auth-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 40px; }
.form-group { margin-bottom: 20px; text-align: left; }
.form-label { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.form-input { width: 100%; background: var(--dark-3); border: 1px solid var(--border); color: var(--cream); padding: 14px 16px; font-family: inherit; font-size: 14px; border-radius: 4px; outline: none; }
.form-input:focus { border-color: var(--orange); }

.actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; }
.remember { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.forgot { color: var(--orange); }

.btn-login { width: 100%; background: var(--orange); color: var(--dark); padding: 16px; border-radius: 4px; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; border: none; cursor: pointer; transition: 0.3s; }
.btn-login:hover { background: var(--orange-light); }

.divider { margin: 24px 0; height: 1px; background: var(--border); position: relative; }
.divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--dark-2); padding: 0 12px; color: var(--muted); font-size: 12px; }

.signup-link { margin-top: 24px; font-size: 14px; color: var(--muted); }
.signup-link a { color: var(--orange); font-weight: 500; }

footer { text-align: center; padding: 24px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }

@media (max-width: 480px) { .auth-box { padding: 32px 24px; } }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <div class="logo" onclick="window.location.href='crea-studio.html'"><span>Créa</span>Studio</div>
</nav>

<div class="auth-container">
  <div class="auth-box">
    <h2 class="auth-title">Connexion</h2>
    <p class="auth-subtitle">Accédez à votre espace client</p>
    
    <form>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="jeanplacali@exemple.com">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" class="form-input" placeholder="xxxxxxxx">
      </div>
      
      <div class="actions">
        <label class="remember"><input type="checkbox"> Se souvenir</label>
        <a href="#" class="forgot">Mot de passe oublié ?</a>
      </div>
      
      <button type="submit" class="btn-login">Se connecter</button>
    </form>
    
    <div class="divider"><span>ou</span></div>
    
    <div class="signup-link">
      Pas encore de compte ? <a href="#">Créer un compte</a>
    </div>
 </div>

</body>
</html>
