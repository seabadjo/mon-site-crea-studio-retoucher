<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Créa Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --dark: #080808;
  --dark-2: #111111;
  --dark-3: #1a1a1a;
  --cream: #f2ede4;
  --orange: #e85d26;
  --orange-light: #ff7a47;
  --muted: rgba(242, 237, 228, 0.55);
  --border: rgba(242, 237, 228, 0.08);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--cream); cursor: none; overflow: hidden; }
a { text-decoration: none; color: inherit; }

.cursor { position: fixed; width: 12px; height: 12px; background: var(--orange); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
.cursor-ring { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(232,93,38,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); }

.logo { position: fixed; top: 24px; left: 48px; font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; z-index: 100; }
.logo span { color: var(--orange); }

/* ERROR CONTAINER */
.error-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* GLITCH TEXT */
.error-glitch {
  font-family: 'Syne', sans-serif;
  font-size: clamp(120px, 25vw, 200px);
  font-weight: 800;
  line-height: 1;
  position: relative;
  animation: glitch-skew 1s infinite linear alternate-reverse;
}

.error-glitch::before,
.error-glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.error-glitch::before {
  left: 2px;
  text-shadow: -2px 0 var(--orange-light);
  clip: rect(44px, 450px, 56px, 0);
  animation: glitch-anim 5s infinite linear alternate-reverse;
}

.error-glitch::after {
  left: -2px;
  text-shadow: -2px 0 #ff0055;
  clip: rect(44px, 450px, 56px, 0);
  animation: glitch-anim2 5s infinite linear alternate-reverse;
}

@keyframes glitch-anim {
  0% { clip: rect(32px, 9999px, 88px, 0); }
  20% { clip: rect(65px, 9999px, 12px, 0); }
  40% { clip: rect(94px, 9999px, 76px, 0); }
  60% { clip: rect(12px, 9999px, 44px, 0); }
  80% { clip: rect(56px, 9999px, 98px, 0); }
  100% { clip: rect(2px, 9999px, 65px, 0); }
}

@keyframes glitch-anim2 {
  0% { clip: rect(56px, 9999px, 2px, 0); }
  20% { clip: rect(12px, 9999px, 88px, 0); }
  40% { clip: rect(76px, 9999px, 34px, 0); }
  60% { clip: rect(44px, 9999px, 12px, 0); }
  80% { clip: rect(98px, 9999px, 56px, 0); }
  100% { clip: rect(65px, 9999px, 2px, 0); }
}

@keyframes glitch-skew {
  0% { transform: skew(0deg); }
  20% { transform: skew(0deg); }
  21% { transform: skew(2deg); }
  22% { transform: skew(0deg); }
  23% { transform: skew(-1deg); }
  24% { transform: skew(0deg); }
  100% { transform: skew(0deg); }
}

/* FLOATING PARTICLES */
.particles {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--orange);
  border-radius: 50%;
  opacity: 0.3;
  animation: float-up 10s infinite linear;
}

@keyframes float-up {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
}

/* MESSAGE */
.error-message {
  margin-top: 32px;
  text-align: center;
  z-index: 10;
}

.error-message h1 {
  font-family: 'Syne', sans-serif;
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 12px;
}

.error-message p {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 32px;
}

.btn-home {
  display: inline-block;
  padding: 16px 32px;
  background: var(--orange);
  color: var(--dark);
  border-radius: 4px;
  font-weight: 600;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  transition: 0.3s;
  cursor: pointer;
}

.btn-home:hover {
  background: var(--orange-light);
  transform: translateY(-2px);
}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="logo" onclick="window.location.href='index.html'"><span>Créa</span>Studio</div>

<div class="error-container">
  <div class="particles" id="particles"></div>
  
  <div class="error-glitch" data-text="404">404</div>
  
  <div class="error-message">
    <h1>Page introuvable</h1>
    <p>Cette page semble s'être égarée dans le néant digital...</p>
    <a href="index.html" class="btn-home">Retour à l'accueil</a>
  </div>
</div>

<script>
// Cursor
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursorRing');

document.addEventListener('mousemove', (e) => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
  cursorRing.style.left = e.clientX + 'px';
  cursorRing.style.top = e.clientY + 'px';
});

document.querySelectorAll('a, button').forEach(el => {
  el.addEventListener('mouseenter', () => { cursor.classList.add('hover'); cursorRing.classList.add('hover'); });
  el.addEventListener('mouseleave', () => { cursor.classList.remove('hover'); cursorRing.classList.remove('hover'); });
});

// Particles
const particlesContainer = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const particle = document.createElement('div');
  particle.className = 'particle';
  particle.style.left = Math.random() * 100 + '%';
  particle.style.animationDelay = Math.random() * 10 + 's';
  particle.style.animationDuration = (8 + Math.random() * 4) + 's';
  particlesContainer.appendChild(particle);
}
</script>

</body>
</html>
