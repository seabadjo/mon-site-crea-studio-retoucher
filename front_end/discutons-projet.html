<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discutons votre projet | Créa Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --dark: #080808;
  --dark-2: #111111;
  --dark-3: #1a1a1a;
  --cream: #f2ede4;
  --orange: #e85d26;
  --orange-light: #ff7a47;
  --muted: rgba(242, 237, 228, 0.55);
  --border: rgba(242, 237, 228, 0.08);
  --success: #2ecc71;
  --warning: #f39c12;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--cream); cursor: none; }
a { text-decoration: none; color: inherit; }

.cursor { position: fixed; width: 12px; height: 12px; background: var(--orange); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
.cursor-ring { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(232,93,38,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); }
.cursor.hover { width: 6px; height: 6px; }
.cursor-ring.hover { width: 60px; height: 60px; border-color: var(--orange); }

.logo { position: fixed; top: 24px; left: 48px; font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; z-index: 100; cursor: pointer; }
.logo span { color: var(--orange); }

.page-container { min-height: 100vh; padding: 120px 24px 80px; max-width: 800px; margin: 0 auto; }
.page-header { text-align: center; margin-bottom: 48px; }
.page-title { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 700; margin-bottom: 12px; }
.page-subtitle { color: var(--muted); font-size: 14px; line-height: 1.6; }

/* FORM CARD */
.form-card { background: var(--dark-2); border: 1px solid var(--border); border-radius: 12px; padding: 40px; }

.form-section { margin-bottom: 40px; }
.form-section-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 600; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }

.form-group { margin-bottom: 24px; }
.form-label { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.form-input, .form-textarea { width: 100%; background: var(--dark-3); border: 1px solid var(--border); color: var(--cream); padding: 14px 16px; font-family: inherit; font-size: 14px; border-radius: 4px; outline: none; transition: 0.3s; }
.form-textarea { min-height: 150px; resize: vertical; }
.form-input:focus, .form-textarea:focus { border-color: var(--orange); }

/* OPTIONS GRID */
.options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.option-card { background: var(--dark-3); border: 1px solid var(--border); border-radius: 8px; padding: 20px 16px; text-align: center; cursor: pointer; transition: 0.3s; }
.option-card:hover { border-color: var(--orange-light); }
.option-card.selected { background: var(--orange); border-color: var(--orange); color: var(--dark); }
.option-card input { display: none; }
.option-icon { font-size: 24px; margin-bottom: 8px; }
.option-label { font-size: 13px; font-weight: 500; }

/* FILE UPLOAD */
.file-upload { border: 2px dashed var(--border); border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; }
.file-upload:hover { border-color: var(--orange); }
.file-upload-icon { font-size: 32px; margin-bottom: 12px; }
.file-upload-text { color: var(--muted); font-size: 14px; }
.file-upload-text span { color: var(--orange); }

/* BUDGET SLIDER */
.range-slider { width: 100%; -webkit-appearance: none; background: var(--dark-3); height: 8px; border-radius: 4px; outline: none; }
.range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--orange); border-radius: 50%; cursor: pointer; }
.range-value { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; color: var(--orange); margin-top: 12px; }

/* SUBMIT */
.btn-submit { width: 100%; background: var(--orange); color: var(--dark); padding: 18px; border-radius: 4px; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; border: none; cursor: pointer; transition: 0.3s; margin-top: 16px; }
.btn-submit:hover { background: var(--orange-light); transform: translateY(-2px); }

@media (max-width: 600px) {
  .form-card { padding: 24px; }
  .page-title { font-size: 28px; }
}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="logo" onclick="window.location.href='index.html'"><span>Créa</span>Studio</div>

<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Discutons votre projet</h1>
    <p class="page-subtitle">Parlons de votre besoin. Je reviens vers vous sous 24h avec un devis détaillé.</p>
  </div>
  
  <div class="form-card">
    <form>
      
      <!-- TYPE DE PROJET -->
      <div class="form-section">
        <h3 class="form-section-title">Type de projet</h3>
        <div class="options-grid">
          <label class="option-card">
            <input type="radio" name="projectType" value="site">
            <div class="option-icon">🌐</div>
            <div class="option-label">Site Web</div>
          </label>
          <label class="option-card">
            <input type="radio" name="projectType" value="ecommerce">
            <div class="option-icon">🛒</div>
            <div class="option-label">E-commerce</div>
          </label>
          <label class="option-card">
            <input type="radio" name="projectType" value="app">
            <div class="option-icon">📱</div>
            <div class="option-label">Application</div>
          </label>
          <label class="option-card">
            <input type="radio" name="projectType" value="branding">
            <div class="option-icon">🎨</div>
            <div class="option-label">Branding</div>
          </label>
          <label class="option-card">
            <input type="radio" name="projectType" value="autre">
            <div class="option-icon">✨</div>
            <div class="option-label">Autre</div>
          </label>
        </div>
      </div>
      
      <!-- DÉTAILS -->
      <div class="form-section">
        <h3 class="form-section-title">Détails du projet</h3>
        <div class="form-group">
          <label class="form-label">Nom du projet</label>
          <input type="text" class="form-input" placeholder="Mon super projet">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" placeholder="Décrivez votre projet en quelques lignes..."></textarea>
        </div>
      </div>
      
      <!-- BUDGET -->
      <div class="form-section">
        <h3 class="form-section-title">Budget estimé</h3>
        <input type="range" class="range-slider" min="500" max="20000" step="500" value="3000" id="budgetSlider" oninput="updateBudget()">
        <div class="range-value" id="budgetValue">3 000 €</div>
      </div>
      
      <!-- DÉLAI -->
      <div class="form-section">
        <h3 class="form-section-title">Délai souhaité</h3>
        <div class="options-grid">
          <label class="option-card">
            <input type="radio" name="timeline" value="urgent">
            <div class="option-label"> ASAP</div>
          </label>
          <label class="option-card">
            <input type="radio" name="timeline" value="1month">
            <div class="option-label">1 mois</div>
          </label>
          <label class="option-card">
            <input type="radio" name="timeline" value="3months">
            <div class="option-label">3 mois</div>
          </label>
          <label class="option-card">
            <input type="radio" name="timeline" value="flexible">
            <div class="option-label">Flexible</div>
          </label>
        </div>
      </div>
      
      <!-- FICHIERS -->
      <div class="form-section">
        <h3 class="form-section-title">Documents (optionnel)</h3>
        <div class="file-upload">
          <div class="file-upload-icon">📎</div>
          <div class="file-upload-text">Glissez vos fichiers ici ou <span>parcourir</span></div>
        </div>
      </div>
      
      <!-- CONTACT -->
      <div class="form-section">
        <h3 class="form-section-title">Vos coordonnées</h3>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="jeanplacali@exemple.com">
        </div>
        <div class="form-group">
          <label class="form-label">Téléphone</label>
          <input type="tel" class="form-input" placeholder="+225 01 23 45 67 89">
        </div>
      </div>
      
      <button type="submit" class="btn-submit">Envoyer ma demande</button>
    </form>
  </div>
</div>

<script>
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursorRing');

document.addEventListener('mousemove', (e) => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
  cursorRing.style.left = e.clientX + 'px';
  cursorRing.style.top = e.clientY + 'px';
});

document.querySelectorAll('a, button, input, .option-card, .file-upload').forEach(el => {
  el.addEventListener('mouseenter', () => { cursor.classList.add('hover'); cursorRing.classList.add('hover'); });
  el.addEventListener('mouseleave', () => { cursor.classList.remove('hover'); cursorRing.classList.remove('hover'); });
});

// Option cards selection
document.querySelectorAll('.option-card input').forEach(input => {
  input.addEventListener('change', function() {
    document.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));
    this.closest('.option-card').classList.add('selected');
  });
});

// Budget slider
function updateBudget() {
  const value = document.getElementById('budgetSlider').value;
  document.getElementById('budgetValue').textContent = parseInt(value).toLocaleString() + ' €';
}
</script>

</body>
</html>
