<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Projets | Créa Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --dark: #080808;
  --dark-2: #111111;
  --dark-3: #1a1a1a;
  --cream: #f2ede4;
  --orange: #e85d26;
  --orange-light: #ff7a47;
  --muted: rgba(242, 237, 228, 0.55);
  --border: rgba(242, 237, 228, 0.08);
  --success: #2ecc71;
  --warning: #f39c12;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--cream); cursor: none; }
a { text-decoration: none; color: inherit; }

.cursor { position: fixed; width: 12px; height: 12px; background: var(--orange); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
.cursor-ring { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(232,93,38,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); }
.cursor.hover { width: 6px; height: 6px; }
.cursor-ring.hover { width: 60px; height: 60px; border-color: var(--orange); }

.logo { position: fixed; top: 24px; left: 48px; font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; z-index: 100; cursor: pointer; }
.logo span { color: var(--orange); }

/* HEADER */
.page-header { padding: 120px 24px 32px; max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 24px; }
.page-title { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 700; }
.page-subtitle { color: var(--muted); font-size: 14px; margin-top: 8px; }

/* FILTERS */
.filters { display: flex; gap: 12px; flex-wrap: wrap; }
.filter-btn { background: var(--dark-2); border: 1px solid var(--border); color: var(--muted); padding: 10px 20px; border-radius: 4px; font-size: 13px; cursor: pointer; transition: 0.3s; }
.filter-btn:hover, .filter-btn.active { background: var(--orange); border-color: var(--orange); color: var(--dark); }

/* PROJECTS GRID */
.projects-container { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }
.projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; }

/* PROJECT CARD */
.project-card { background: var(--dark-2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; transition: 0.3s; cursor: pointer; }
.project-card:hover { border-color: var(--orange); transform: translateY(-4px); }

.project-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.project-icon { width: 48px; height: 48px; }
