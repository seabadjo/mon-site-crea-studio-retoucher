<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié | Créa Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --dark: #080808;
  --dark-2: #111111;
  --dark-3: #1a1a1a;
  --cream: #f2ede4;
  --orange: #e85d26;
  --orange-light: #ff7a47;
  --muted: rgba(242, 237, 228, 0.55);
  --border: rgba(242, 237, 228, 0.08);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--cream); cursor: none; }
a { text-decoration: none; color: inherit; }

.cursor { position: fixed; width: 12px; height: 12px; background: var(--orange); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
.cursor-ring { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(232,93,38,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); }
.cursor.hover { width: 6px; height: 6px; }
.cursor-ring.hover { width: 60px; height: 60px; border-color: var(--orange); }

.logo { position: fixed; top: 24px; left: 48px; font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; z-index: 100; }
.logo span { color: var(--orange); }

.auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 120px 24px 80px; }
.auth-box { width: 100%; max-width: 420px; background: var(--dark-2); padding: 48px; border: 1px solid var(--border); border-radius: 12px; text-align: center; }
.auth-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.auth-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 40px; }

.form-group { margin-bottom: 20px; text-align: left; }
.form-label { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.form-input { width: 100%; background: var(--dark-3); border: 1px solid var(--border); color: var(--cream); padding: 14px 16px; font-family: inherit; font-size: 14px; border-radius: 4px; outline: none; transition: 0.3s; }
.form-input:focus { border-color: var(--orange); }

.btn-reset { width: 100%; background: var(--orange); color: var(--dark); padding: 16px; border-radius: 4px; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; border: none; cursor: pointer; transition: 0.3s; }
.btn-reset:hover { background: var(--orange-light); }

.divider { margin: 24px 0; height: 1px; background: var(--border); position: relative; }
.divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--dark-2); padding: 0 12px; color: var(--muted); font-size: 12px; }

.signup-link { margin-top: 24px; font-size: 14px; color: var(--muted); }
.signup-link a { color: var(--orange); font-weight: 500; }

/* SUCCESS MESSAGE */
.success-message { display: none; text-align: center; }
.success-icon { width: 64px; height: 64px; background: var(--orange); border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; }
.success-icon svg { width: 32px; height: 32px; stroke: var(--dark); }
.success-title { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 12px; }
.success-text { color: var(--muted); font-size: 14px; line-height: 1.6; }

@media (max-width: 480px) { .auth-box { padding: 32px 24px; } }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="logo" onclick="window.location.href='index.html'"><span>Créa</span>Studio</div>

<div class="auth-container">
  <div class="auth-box">
    
    <!-- FORM -->
    <div id="resetForm">
      <h2 class="auth-title">Réinitialiser</h2>
      <p class="auth-subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>
      
      <form onsubmit="handleReset(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="jeanplacali@exemple.com" required>
        </div>
        
        <button type="submit" class="btn-reset">Envoyer le lien</button>
      </form>
      
      <div class="divider"><span>ou</span></div>
      
      <div class="signup-link">
        <a href="connexion.html">Retour à la connexion</a>
      </div>
    </div>
    
    <!-- SUCCESS -->
    <div class="success-message" id="successMessage">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h3 class="success-title">Email envoyé !</h3>
      <p class="success-text">Nous avons envoyé un lien de réinitialisation à votre adresse email. Veuillez vérifier votre boîte de réception.</p>
      
      <div class="signup-link" style="margin-top: 32px;">
        <a href="connexion.html">Retour à la connexion</a>
      </div>
    </div>
    
  </div>
</div>

<script>
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursorRing');

document.addEventListener('mousemove', (e) => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
  cursorRing.style.left = e.clientX + 'px';
  cursorRing.style.top = e.clientY + 'px';
});

document.querySelectorAll('a, button, input').forEach(el => {
  el.addEventListener('mouseenter', () => { cursor.classList.add('hover'); cursorRing.classList.add('hover'); });
  el.addEventListener('mouseleave', () => { cursor.classList.remove('hover'); cursorRing.classList.remove('hover'); });
});

function handleReset(e) {
  e.preventDefault();
  
  const form = document.getElementById('resetForm');
  const success = document.getElementById('successMessage');
  
  form.style.display = 'none';
  success.style.display = 'block';
}
</script>

</body>
</html>
