<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créa Studio | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
:root {
  --dark:#080808;--dark-2:#101010;--dark-3:#181818;--dark-4:#222;
  --cream:#f2ede4;--orange:#e85d26;--ol:#ff7a47;
  --od:rgba(232,93,38,.12);--ob:rgba(232,93,38,.3);
  --muted:rgba(242,237,228,.55);--muted-2:rgba(242,237,228,.3);
  --border:rgba(242,237,228,.07);--border-2:rgba(242,237,228,.11);
  --green:#22c55e;--gd:rgba(34,197,94,.12);
  --red:#ef4444;--rd:rgba(239,68,68,.12);
  --blue:#3b82f6;--bd:rgba(59,130,246,.12);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--cream);display:flex;flex-direction:column;overflow:hidden}

/* LOGIN */
.login-overlay{position:fixed;inset:0;background:rgba(8,8,8,.97);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:var(--dark-2);border:1px solid var(--border-2);border-radius:16px;padding:48px 40px;width:380px}
.login-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:6px}
.login-title span{color:var(--orange)}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2);margin-bottom:7px}
.lf input{width:100%;background:var(--dark-3);border:1px solid var(--border-2);color:var(--cream);padding:12px 16px;font-size:14px;border-radius:8px;font-family:'DM Sans',sans-serif;outline:none}
.lf input:focus{border-color:var(--ob)}
.login-btn{width:100%;background:var(--orange);color:var(--dark);padding:13px;border-radius:8px;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px}

/* LAYOUT */
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(8,8,8,.97);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;letter-spacing:-.03em}
.logo span{color:var(--orange)}
.admin-badge{background:var(--od);border:1px solid var(--ob);color:var(--orange);font-size:11px;font-weight:700;padding:4px 12px;border-radius:100px;letter-spacing:.08em}
.notif-btn{position:relative;background:var(--dark-3);border:1px solid var(--border-2);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif}
.notif-badge{position:absolute;top:-6px;right:-6px;background:var(--orange);color:var(--dark);width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.app{display:grid;grid-template-columns:280px 1fr 300px;flex:1;overflow:hidden}

/* CONVERSATIONS LIST */
.conv-list{background:var(--dark-2);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.conv-list-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.conv-list-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700}
.conv-count{font-size:11px;color:var(--muted-2)}
.conv-item{padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s;position:relative}
.conv-item:hover{background:var(--dark-3)}
.conv-item.active{background:var(--dark-3);border-left:2px solid var(--orange)}
.conv-ref{font-size:11px;color:var(--orange);font-weight:600;letter-spacing:.06em;margin-bottom:3px}
.conv-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700}
.conv-project{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-meta{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.conv-status{font-size:10px;padding:2px 8px;border-radius:100px;font-weight:600;letter-spacing:.06em}
.st-pending{background:rgba(251,191,36,.1);color:#fbbf24}
.st-negotiating{background:var(--od);color:var(--orange)}
.st-accepted{background:var(--gd);color:var(--green)}
.conv-unread{background:var(--orange);color:var(--dark);width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* CHAT */
.chat-area{display:flex;flex-direction:column;overflow:hidden}
.chat-header{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--dark-2);flex-shrink:0}
.chat-header-left{display:flex;align-items:center;gap:12px}
.chat-avatar{width:36px;height:36px;border-radius:50%;background:var(--od);border:1px solid var(--ob);color:var(--orange);font-family:'Syne',sans-serif;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.chat-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.chat-sub{font-size:12px;color:var(--muted)}
.chat-header-actions{display:flex;gap:8px}
.status-change{background:var(--dark-3);border:1px solid var(--border-2);color:var(--muted);padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .25s}
.status-change:hover{color:var(--cream)}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
.msg{display:flex;gap:8px;max-width:75%;animation:msgIn .3s cubic-bezier(.16,1,.3,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.admin{align-self:flex-end;flex-direction:row-reverse}
.msg.client{align-self:flex-start}
.msg.system{align-self:center;max-width:90%}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Syne',sans-serif}
.msg.admin .msg-av{background:var(--orange);color:var(--dark)}
.msg.client .msg-av{background:var(--dark-4);color:var(--muted);border:1px solid var(--border-2)}
.msg-bbl{padding:11px 14px;border-radius:14px;font-size:13px;line-height:1.6}
.msg.admin .msg-bbl{background:var(--orange);color:var(--dark);border-bottom-right-radius:3px}
.msg.client .msg-bbl{background:var(--dark-3);border:1px solid var(--border-2);border-bottom-left-radius:3px}
.msg.system .msg-bbl{background:var(--dark-3);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted);text-align:center}
.msg-time{font-size:10px;color:var(--muted-2);margin-top:3px}
.msg.admin .msg-time{text-align:right}
/* OFFER CARDS */
.offer-card{background:var(--dark-3);border:1px solid var(--border-2);border-radius:14px;overflow:hidden;min-width:240px}
.offer-card.from-admin{border-color:var(--ob)}
.offer-card.from-client{border-color:var(--blue)}
.offer-hd{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.offer-hd.admin-hd{background:var(--od)}
.offer-hd.client-hd{background:var(--bd)}
.offer-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.offer-amt{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.03em;padding:12px 14px 2px}
.offer-amt.oc{color:var(--orange)}
.offer-amt.bc{color:var(--blue)}
.offer-fcfa{font-size:12px;color:var(--muted);padding:0 14px 12px}
.offer-acts{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--border)}
.o-btn{flex:1;padding:8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .2s}
.o-btn.acc{background:var(--gd);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.o-btn.acc:hover{background:var(--green);color:var(--dark)}
.o-btn.rej{background:var(--rd);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.o-btn.rej:hover{background:var(--red);color:#fff}
.o-btn.cnt{background:var(--dark-4);color:var(--muted);border:1px solid var(--border-2)}
.o-btn.cnt:hover{color:var(--cream)}
.offer-badge{margin:0 14px 12px;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600;text-align:center}
.offer-badge.accepted{background:var(--gd);color:var(--green)}
.offer-badge.rejected{background:var(--rd);color:var(--red)}
.offer-badge.countered{background:var(--od);color:var(--orange)}
/* INPUT */
.input-area{padding:14px 18px;border-top:1px solid var(--border);background:var(--dark-2);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-box{flex:1;background:var(--dark-3);border:1px solid var(--border-2);border-radius:10px;padding:11px 14px;color:var(--cream);font-family:'DM Sans',sans-serif;font-size:13px;resize:none;max-height:100px;outline:none;transition:border-color .3s;line-height:1.5}
.input-box:focus{border-color:var(--ob)}
.input-box::placeholder{color:var(--muted-2)}
.send-btn{width:40px;height:40px;border-radius:8px;background:var(--orange);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;flex-shrink:0}
.send-btn:hover{background:var(--ol);transform:scale(1.05)}
.send-btn svg{width:16px;height:16px;stroke:var(--dark);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* SIDEBAR RIGHT */
.sidebar-right{background:var(--dark-2);border-left:1px solid var(--border);overflow-y:auto;padding:18px}
.sr-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:16px}
.sr-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:10px}
.sr-section{margin-bottom:24px}
/* Offer form */
.off-form{display:flex;flex-direction:column;gap:8px}
.off-input-wrap{position:relative}
.off-input{width:100%;background:var(--dark-3);border:1px solid var(--border-2);color:var(--cream);padding:11px 48px 11px 14px;font-size:14px;font-family:'Syne',sans-serif;font-weight:700;border-radius:8px;outline:none;transition:border-color .3s}
.off-input:focus{border-color:var(--ob)}
.off-unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted-2)}
.off-note{width:100%;background:var(--dark-3);border:1px solid var(--border-2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--cream);font-family:'DM Sans',sans-serif;outline:none;resize:none;min-height:56px}
.off-note:focus{border-color:var(--ob)}
.off-note::placeholder{color:var(--muted-2)}
.btn-off{width:100%;background:var(--orange);color:var(--dark);padding:10px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s}
.btn-off:hover{background:var(--ol)}
/* Client info */
.ci-block{background:var(--dark-3);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:7px}
.ci-row{display:flex;justify-content:space-between;font-size:12px}
.ci-row .k{color:var(--muted-2)}
.ci-row .v{font-weight:500;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Quick */
.q-list{display:flex;flex-direction:column;gap:5px}
.q-btn{background:var(--dark-3);border:1px solid var(--border-2);color:var(--muted);padding:8px 12px;border-radius:7px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;text-align:left;transition:all .2s}
.q-btn:hover{color:var(--cream);border-color:var(--border)}

/* empty state */
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted-2)}
.empty-chat-icon{font-size:48px;opacity:.3}
.empty-chat-text{font-size:14px}

/* counter modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-ov.show{display:flex}
.modal-box{background:var(--dark-2);border:1px solid var(--border-2);border-radius:12px;padding:28px;width:320px}
.modal-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;margin-bottom:18px}
.modal-fi{margin-bottom:14px}
.modal-fi label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-bottom:7px}
.modal-fi input{width:100%;background:var(--dark-3);border:1px solid var(--border-2);color:var(--cream);padding:11px 14px;font-size:15px;font-family:'Syne',sans-serif;font-weight:700;border-radius:8px;outline:none}
.modal-acts{display:flex;gap:8px}
.modal-cancel{flex:1;background:var(--dark-3);color:var(--muted);border:1px solid var(--border-2);padding:10px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
.modal-confirm{flex:1;background:var(--orange);color:var(--dark);border:none;padding:10px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-title">Admin <span>Créa Studio</span></div>
    <p class="login-sub">Accès réservé. Entrez le code administrateur.</p>
    <div class="lf">
      <label>Code administrateur</label>
      <input type="password" id="adminCode" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="login-btn" onclick="login()">Accéder au tableau de bord</button>
  </div>
</div>

<!-- COUNTER MODAL -->
<div class="modal-ov" id="counterModal">
  <div class="modal-box">
    <div class="modal-title">Contre-proposition</div>
    <div class="modal-fi">
      <label>Montant proposé (FCFA)</label>
      <input type="number" id="counterInput" placeholder="150 000">
    </div>
    <div class="modal-acts">
      <button class="modal-cancel" onclick="closeCounter()">Annuler</button>
      <button class="modal-confirm" onclick="submitCounter()">Envoyer</button>
    </div>
  </div>
</div>

<!-- NAV -->
<nav>
  <div class="logo"><span>Créa</span>Studio</div>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="notif-btn" id="notifBtn" onclick="loadNotifs()">🔔 Notifications <span class="notif-badge" id="notifCount" style="display:none">0</span></button>
    <div class="admin-badge">ADMIN</div>
  </div>
</nav>

<div class="app">

  <!-- CONV LIST -->
  <div class="conv-list">
    <div class="conv-list-header">
      <div class="conv-list-title">Conversations</div>
      <div class="conv-count" id="convCount">0</div>
    </div>
    <div id="convList"></div>
  </div>

  <!-- CHAT -->
  <div class="chat-area" id="chatArea">
    <div class="empty-chat" id="emptyChat">
      <div class="empty-chat-icon">💬</div>
      <div class="empty-chat-text">Sélectionnez une conversation</div>
    </div>
    <div id="chatContent" style="display:none;flex:1;display:none;flex-direction:column;overflow:hidden">
      <div class="chat-header">
        <div class="chat-header-left">
          <div class="chat-avatar" id="chAvatar">?</div>
          <div>
            <div class="chat-name" id="chName">—</div>
            <div class="chat-sub" id="chSub">—</div>
          </div>
        </div>
        <div class="chat-header-actions">
          <select class="status-change" id="statusSelect" onchange="changeStatus()">
            <option value="pending">En attente</option>
            <option value="negotiating">En négociation</option>
            <option value="accepted">Accepté ✅</option>
            <option value="rejected">Refusé ❌</option>
          </select>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <div class="input-row">
          <textarea class="input-box" id="inputMsg" placeholder="Votre réponse…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        </div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR RIGHT -->
  <div class="sidebar-right">
    <div class="sr-title">Actions</div>

    <div class="sr-section">
      <div class="sr-label">Témoignages</div>
      <div class="off-form">
        <textarea class="off-note" id="testimonialForm" placeholder="Écrivez un témoignage…"></textarea>
        <input class="off-input" id="testimonialName" placeholder="Nom du client">
        <input class="off-input" id="testimonialRole" placeholder="Rôle / entreprise">
        <button class="btn-off" onclick="saveTestimonial()">💬 Enregistrer</button>
      </div>
    </div>

    <div class="sr-section">
      <div class="sr-label">Envoyer une offre de prix</div>
      <div class="off-form">
        <div class="off-input-wrap">
          <input class="off-input" type="number" id="offerAmt" placeholder="200 000">
          <span class="off-unit">FCFA</span>
        </div>
        <textarea class="off-note" id="offerNote" placeholder="Votre message…"></textarea>
        <button class="btn-off" onclick="sendOffer()">💼 Envoyer mon offre</button>
      </div>
    </div>

    <div class="sr-section">
      <div class="sr-label">Réponses rapides</div>
      <div class="q-list">
        <button class="q-btn" onclick="sendQuick('Bonjour ! J\'ai bien reçu votre demande et je l\'analyse. Je reviens vers vous sous 24h.')">👋 Accusé de réception</button>
        <button class="q-btn" onclick="sendQuick('Ce tarif inclut toutes les révisions nécessaires jusqu\'à votre satisfaction.')">ℹ️ Révisions incluses</button>
        <button class="q-btn" onclick="sendQuick('Un acompte de 50% est demandé au démarrage, le solde à la livraison.')">💳 Modalités paiement</button>
        <button class="q-btn" onclick="sendQuick('Parfait ! Je prépare le contrat et vous l\'envoie par email.')">📄 Préparer contrat</button>
        <button class="q-btn" onclick="sendQuick('Avez-vous des questions supplémentaires sur la prestation ?')">❓ Questions ?</button>
      </div>
    </div>

    <div class="sr-section">
      <div class="sr-label">Informations client</div>
      <div class="ci-block" id="clientInfo">
        <div class="ci-row"><span class="k">—</span><span class="v">—</span></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
const ADMIN_CODE = 'admin1234'; // Doit correspondre au serveur
let socket, activeConvId = null, activeDevisId = null, pendingOfferId = null;
let typingTimeout = null;

// ─── AUTH ────────────────────────────────────────────────────
function login() {
  const code = document.getElementById('adminCode').value;
  if (code === ADMIN_CODE) {
    document.getElementById('loginOverlay').style.display = 'none';
    initAdmin();
  } else {
    document.getElementById('adminCode').style.borderColor = '#ef4444';
    setTimeout(() => document.getElementById('adminCode').style.borderColor = '', 1500);
  }
}

// ─── INIT ADMIN ──────────────────────────────────────────────
async function initAdmin() {
  await loadConversations();
  loadNotifCount();
  initSocket();
}

async function loadConversations() {
  const res = await fetch(`${API}/api/conversations`);
  const list = await res.json();
  document.getElementById('convCount').textContent = list.length;
  const el = document.getElementById('convList');
  el.innerHTML = list.map(c => `
    <div class="conv-item" onclick="openConv(${c.id}, ${c.devis_id},'${c.ref}','${c.first_name} ${c.last_name}','${c.devis_status||'pending'}')" id="ci-${c.id}">
      <div class="conv-ref">${c.ref}</div>
      <div class="conv-name">${c.first_name} ${c.last_name}</div>
      <div class="conv-project">${c.project_name||'—'}</div>
      <div class="conv-meta">
        <span class="conv-status st-${c.devis_status||'pending'}">${statusLabel(c.devis_status)}</span>
      </div>
    </div>`).join('');
}

function statusLabel(s) {
  return {pending:'En attente',negotiating:'En négociation',accepted:'Accepté',rejected:'Refusé'}[s]||s||'—';
}

// ─── OUVRIR CONVERSATION ─────────────────────────────────────
async function openConv(convId, devisId, ref, clientName, status) {
  activeConvId = convId; activeDevisId = devisId;

  // UI active
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  const ci = document.getElementById('ci-'+convId);
  if (ci) ci.classList.add('active');

  document.getElementById('emptyChat').style.display = 'none';
  const cc = document.getElementById('chatContent');
  cc.style.display = 'flex'; cc.style.flexDirection = 'column';

  const initials = clientName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('chAvatar').textContent = initials;
  document.getElementById('chName').textContent = clientName;
  document.getElementById('chSub').textContent = ref;
  document.getElementById('statusSelect').value = status;

  // Charger devis info
  const dr = await fetch(`${API}/api/devis/${ref}`);
  const dv = await dr.json();
  loadClientInfo(dv, clientName);

  // Rejoindre socket room
  if (socket) {
    if (activeConvId) socket.emit('join_conversation', { conv_id: convId, sender_name: 'Créa Studio', sender_type: 'admin' });
  }
}

function loadClientInfo(dv, name) {
  document.getElementById('clientInfo').innerHTML = `
    <div class="ci-row"><span class="k">Client</span><span class="v">${name}</span></div>
    <div class="ci-row"><span class="k">Email</span><span class="v">${dv.email||'—'}</span></div>
    <div class="ci-row"><span class="k">Entreprise</span><span class="v">${dv.company||'—'}</span></div>
    <div class="ci-row"><span class="k">Secteur</span><span class="v">${dv.sector||'—'}</span></div>
    <div class="ci-row"><span class="k">Budget</span><span class="v">${(dv.budget||0).toLocaleString('fr-FR')} FCFA</span></div>
    <div class="ci-row"><span class="k">Estimation</span><span class="v">${(dv.final_price||0).toLocaleString('fr-FR')} FCFA</span></div>
    <div class="ci-row"><span class="k">Délai</span><span class="v">${dv.delai||'—'}</span></div>`;
}

async function changeStatus() {
  if (!activeDevisId) return;
  const status = document.getElementById('statusSelect').value;
  await fetch(`${API}/api/devis/${activeDevisId}/status`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status})
  });
  const ci = document.getElementById('ci-'+activeConvId);
  if (ci) {
    const badge = ci.querySelector('.conv-status');
    if (badge) { badge.className='conv-status st-'+status; badge.textContent=statusLabel(status); }
  }
}

// ─── SOCKET ──────────────────────────────────────────────────
function initSocket() {
  socket = io(API);
  socket.on('connect', () => console.log('Admin connecté'));
  socket.on('history', msgs => {
    document.getElementById('messages').innerHTML = '';
    msgs.forEach(m => renderMessage(m));
    scrollBottom();
  });
  socket.on('new_message', msg => { renderMessage(msg); scrollBottom(); });
  socket.on('admin_notification', data => { loadNotifCount(); loadConversations(); });
  socket.on('offer_response', ({message_id, response}) => {
    const el = document.querySelector(`[data-offer-id="${message_id}"]`);
    if (el) updateOfferUI(el, response);
  });
  socket.on('typing', ({name}) => {
    document.getElementById('chSub').textContent = name + ' écrit…';
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      const subEl = document.getElementById('chSub');
      if (subEl) subEl.textContent = document.querySelector('.conv-item.active .conv-ref')?.textContent || '';
    }, 2000);
  });
}

// ─── MESSAGES ────────────────────────────────────────────────
function renderMessage(msg) {
  const wrap = document.createElement('div');
  const isSystem = msg.sender_type === 'system';
  const isAdmin  = msg.sender_type === 'admin';
  wrap.className = 'msg ' + (isSystem?'system':isAdmin?'admin':'client');

  if (msg.type === 'offer') {
    wrap.innerHTML = renderOffer(msg);
  } else {
    const initials = msg.sender_name?.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
    const time = new Date(msg.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    if (!isSystem) {
      wrap.innerHTML = `<div class="msg-av">${initials}</div><div><div class="msg-bbl">${escHtml(msg.content)}</div><div class="msg-time">${time}</div></div>`;
    } else {
      wrap.innerHTML = `<div class="msg-bbl">${escHtml(msg.content)}</div>`;
    }
  }
  document.getElementById('messages').appendChild(wrap);
}

function renderOffer(msg) {
  const isAdmin = msg.sender_type === 'admin';
  const isClient = msg.sender_type === 'client';
  const amt = parseInt(msg.offer_amount).toLocaleString('fr-FR');
  const time = new Date(msg.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const status = msg.offer_status;

  // Admin voit les boutons sur les offres du client
  let actions = '';
  if (isClient && status === 'pending') {
    actions = `<div class="offer-acts">
      <button class="o-btn acc" onclick="respondOffer(${msg.id},'accepted')">✅ Accepter</button>
      <button class="o-btn rej" onclick="respondOffer(${msg.id},'rejected')">❌ Refuser</button>
      <button class="o-btn cnt" onclick="openCounter(${msg.id})">↩️ Contre</button>
    </div>`;
  } else if (status && status !== 'pending') {
    const lbls = {accepted:'✅ Acceptée',rejected:'❌ Refusée',countered:'↩️ Contre-proposée'};
    actions = `<div class="offer-badge ${status}">${lbls[status]||status}</div>`;
  }
  const hc = isAdmin ? 'admin-hd' : 'client-hd';
  const ac = isAdmin ? 'oc' : 'bc';
  const lbl = isAdmin ? '💼 Offre Créa Studio' : '💬 Proposition client';

  return `<div class="offer-card ${isAdmin?'from-admin':'from-client'}" data-offer-id="${msg.id}">
    <div class="offer-hd ${hc}"><span>${isAdmin?'💼':'💬'}</span><span class="offer-lbl">${lbl}</span></div>
    <div class="offer-amt ${ac}">${amt}</div>
    <div class="offer-fcfa">FCFA</div>
    ${actions}
  </div><div class="msg-time" style="font-size:10px;color:var(--muted-2);margin-top:3px">${time}</div>`;
}

function updateOfferUI(el, response) {
  const acts = el.querySelector('.offer-acts');
  if (!acts) return;
  const lbls = {accepted:'✅ Acceptée',rejected:'❌ Refusée',countered:'↩️ Contre-proposée'};
  acts.outerHTML = `<div class="offer-badge ${response}">${lbls[response]||response}</div>`;
}

// ─── ACTIONS ─────────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('inputMsg');
  const content = input.value.trim();
  if (!content || !socket || !activeConvId) return;
  socket.emit('send_message', { conv_id: activeConvId, sender_type: 'admin', sender_name: 'Créa Studio', content });
  input.value = ''; autoResize(input);
}

function sendOffer() {
  const amount = parseInt(document.getElementById('offerAmt').value);
  const note   = document.getElementById('offerNote').value.trim();
  if (!amount || !socket || !activeConvId) return;
  const message = note || `Je vous propose ce projet pour ${amount.toLocaleString('fr-FR')} FCFA.`;
  socket.emit('send_offer', { conv_id: activeConvId, sender_type: 'admin', sender_name: 'Créa Studio', amount, message });
  document.getElementById('offerAmt').value = '';
  document.getElementById('offerNote').value = '';
}

function sendQuick(text) {
  if (!socket || !activeConvId) return;
  socket.emit('send_message', { conv_id: activeConvId, sender_type: 'admin', sender_name: 'Créa Studio', content: text });
}

function respondOffer(msgId, response) {
  if (!socket || !activeConvId) return;
  socket.emit('respond_offer', { conv_id: activeConvId, message_id: msgId, response });
}

function openCounter(msgId) { pendingOfferId = msgId; document.getElementById('counterModal').classList.add('show'); }
function closeCounter() { pendingOfferId = null; document.getElementById('counterModal').classList.remove('show'); }
function submitCounter() {
  const amt = parseInt(document.getElementById('counterInput').value);
  if (!amt) return;
  socket.emit('respond_offer', { conv_id: activeConvId, message_id: pendingOfferId, response: 'countered', counter_amount: amt });
  closeCounter();
}

async function loadNotifCount() {
  const r = await fetch(`${API}/api/notifications`);
  const d = await r.json();
  const badge = document.getElementById('notifCount');
  if (d.unread > 0) { badge.style.display='flex'; badge.textContent=d.unread; }
  else badge.style.display = 'none';
}

async function loadNotifs() {
  await fetch(`${API}/api/notifications/read`, {method:'POST'});
  loadNotifCount(); loadConversations();
}

function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
function scrollBottom() { const m=document.getElementById('messages'); m.scrollTop=m.scrollHeight; }
async function saveTestimonial() {
  const quote = document.getElementById('testimonialForm').value.trim();
  const name = document.getElementById('testimonialName').value.trim();
  const role = document.getElementById('testimonialRole').value.trim();
  if (!quote || !name) return;

  try {
    const current = await fetch('http://localhost:3001/api/testimonials').then(r => r.json());
    const updated = [...current, { id: Date.now(), name, role: role || 'Client', quote }];
    await fetch('http://localhost:3001/api/testimonials', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updated)
    });
    document.getElementById('testimonialForm').value = '';
    document.getElementById('testimonialName').value = '';
    document.getElementById('testimonialRole').value = '';
    alert('Témoignage enregistré');
  } catch (error) {
    alert('Erreur lors de l\'enregistrement');
  }
}

function escHtml(s) { return s?.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')||''; }
</script>
